# =============================================================================
# Live-Agent Dokploy Docker Compose 配置
# 用于在 Dokploy 面板中直接部署
# =============================================================================

version: '3.8'

services:
  # ==================== MySQL 数据库 ====================
  xiaozhi-esp32-server-db:
    image: mysql:8.0
    container_name: xiaozhi-esp32-server-db
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 45s
      interval: 10s
      retries: 10
    networks:
      - live-agent-network
    expose:
      - 3306
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-SecurePass123!}
      - MYSQL_DATABASE=xiaozhi_esp32_server

  # ==================== Redis 缓存 ====================
  xiaozhi-esp32-server-redis:
    image: redis:7-alpine
    container_name: xiaozhi-esp32-server-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - live-agent-network
    expose:
      - 6379
    volumes:
      - redis-data:/data

  # ==================== Java API + Vue Web (智控台) ====================
  xiaozhi-esp32-server-web:
    image: ghcr.nju.edu.cn/xinnan-tech/xiaozhi-esp32-server:web_latest
    container_name: xiaozhi-esp32-server-web
    restart: always
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    networks:
      - live-agent-network
    ports:
      - "8002:8002"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_DATASOURCE_DRUID_URL=jdbc:mysql://xiaozhi-esp32-server-db:3306/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      - SPRING_DATASOURCE_DRUID_USERNAME=root
      - SPRING_DATASOURCE_DRUID_PASSWORD=${MYSQL_ROOT_PASSWORD:-SecurePass123!}
      - SPRING_DATA_REDIS_HOST=xiaozhi-esp32-server-redis
      - SPRING_DATA_REDIS_PASSWORD=
      - SPRING_DATA_REDIS_PORT=6379
    volumes:
      - upload-data:/uploadfile

  # ==================== Python WebSocket Server ====================
  xiaozhi-esp32-server:
    image: ghcr.nju.edu.cn/xinnan-tech/xiaozhi-esp32-server:server_latest
    container_name: xiaozhi-esp32-server
    restart: always
    depends_on:
      - xiaozhi-esp32-server-db
      - xiaozhi-esp32-server-redis
      - xiaozhi-esp32-server-web
    networks:
      - live-agent-network
    ports:
      # WebSocket 服务端口
      - "8000:8000"
      # HTTP 服务端口 (视觉分析接口)
      - "8003:8003"
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - server-data:/opt/xiaozhi-esp32-server/data
      - model-data:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall
      - server-logs:/opt/xiaozhi-esp32-server/logs

networks:
  live-agent-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  upload-data:
    driver: local
  server-data:
    driver: local
  model-data:
    driver: local
  server-logs:
    driver: local

